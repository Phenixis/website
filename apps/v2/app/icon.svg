<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#0a0a0d" />

  <!-- glass outline, subtle -->
  <polygon points="28,29 72,29 50,50" fill="none" stroke="#2c2c38" strokeWidth="2" />
  <polygon points="28,71 72,71 50,50" fill="none" stroke="#2c2c38" strokeWidth="2" />

  <!-- sand fill -->
  <polygon points="28,29 72,29 50,50" fill="#b8b8c4" clipPath="url(#topClip)" />
  <polygon points="28,71 72,71 50,50" fill="#b794f6" clipPath="url(#bottomClip)" />
  <defs>
    <clipPath id="topClip">
      <rect x="0" y="29" width="100" height="12.6" />
    </clipPath>
    <clipPath id="bottomClip">
      <rect x="0" y="62.6" width="100" height="8.4" />
    </clipPath>
  </defs>

  <!-- bars, on top -->
  <rect x="26" y="20" width="48" height="6" rx="1.5" fill="#b8b8c4" />
  <rect x="26" y="74" width="48" height="6" rx="1.5" fill="#b8b8c4" />
</svg>
