name: v2 CI

on:
  push:
    branches: [main]
    paths:
      - "apps/v2/**"
      - "packages/content/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/v2-ci.yml"
  pull_request:
    paths:
      - "apps/v2/**"
      - "packages/content/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/v2-ci.yml"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter v2 typecheck

      - name: Lint
        run: pnpm --filter v2 lint

      - name: Test
        run: pnpm --filter v2 test

      - name: Build
        run: pnpm --filter v2 build
